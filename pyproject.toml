[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecaster"
version = "2.5.0"
description = "Time series forecasting, the Python counterpart of ScalaTion's forecasting package: RandomWalk, AR, ARIMA, ARX / ARX_D, ARX_SR / ARX_SR_D, ARX_Formula, NARX_Formula / NARX_SR_D, feature selection and LLM-NARX-SR"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yousef Fekri Dabanloo" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
neural = ["torch>=2.0", "matplotlib>=3.7"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Youseffekri/Forecaster"

[tool.setuptools]
packages = ["modeling", "modeling.forecasting", "modeling.forecasting.nonlinear",
            "modeling.forecasting.nonlinear.llm_narx_sr", "modeling.forecasting.neuralforecasting",
            "modeling.optimization", "Util"]

[tool.pytest.ini_options]
testpaths = ["tests"]
